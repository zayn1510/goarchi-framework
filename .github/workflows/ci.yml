name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Doctor check
        run: go run cli/main.go doctor

      - name: Run govulncheck
        run: go run cli/main.go govulncheck
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "1"